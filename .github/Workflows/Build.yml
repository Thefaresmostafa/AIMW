name: Generate Master README

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Build Script
        run: python .github/build_readme.py

      - name: Commit and Push README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate full master README with all repositories"
          file_pattern: "README.md"
